<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Saveurs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="/index.html" aria-label="Retour">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="content" style="padding-top:0;">
    <h1 class="title">Bon retour</h1>

    <form class="form" id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      <p class="error-msg" id="form-error" hidden></p>
    </form>

    <p style="padding:0 20px;font-size:13.5px;color:var(--ink-dim);">
      Pas encore de compte ? <a class="link" href="/register.html">S'inscrire</a>
    </p>
  </div>

  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
