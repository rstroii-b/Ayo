<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Ayo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script type="module" src="/js/register-sw.js"></script></head>
<body>
  <div class="topbar">
    <a class="back-btn" href="/index.html" aria-label="Retour">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="content" style="padding-top:0;">
    <img src="/assets/logo.png" alt="Ayo" class="brand-logo">
    <h1 class="title">Bon retour</h1>

    <form class="form" id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      <p class="error-msg" id="form-error" hidden></p>
    </form>

    <button type="button" class="btn btn-ghost btn-block" id="passkey-btn" style="margin:2px 20px 0;width:calc(100% - 40px);" hidden>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 00-5 5v3a5 5 0 0010 0V7a5 5 0 00-5-5z"/><path d="M7 10a5 5 0 0010 0"/><path d="M12 15v7"/><path d="M9 19h6"/></svg>
      Face ID / empreinte
    </button>

    <p style="padding:0 20px;font-size:13.5px;color:var(--ink-dim);">
      Pas encore de compte ? <a class="link" href="/register.html">S'inscrire</a>
    </p>
  </div>

  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
