<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes — Ayo Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/backoffice.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script type="module" src="/js/register-sw.js"></script></head>
<body class="desktop">
  <div class="shell">
    <nav class="sidebar">
      <div class="logo">
        <img src="/assets/logo.png" alt="Ayo" style="width:140px;height:auto;">
      </div>
      <a class="navitem active" href="/backoffice.html">Commandes <span class="badge" id="nav-count" hidden></span></a>
      <a class="navitem" href="/backoffice-history.html">Historique</a>
      <a class="navitem" href="/backoffice-menu.html">Menu</a>
      <a class="navitem" href="/backoffice-stats.html">Statistiques</a>
      <a class="navitem" href="/backoffice-settings.html">Paramètres</a>
      <div class="foot" id="restaurant-name-foot"></div>
      <button class="navitem" id="logout-btn" type="button" style="border:none;background:none;cursor:pointer;width:100%;font-family:inherit;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </button>
    </nav>

    <main class="main">
      <div class="dtopbar">
        <h1>Commandes en direct</h1>
        <div id="mobile-money-status"></div>
      </div>

      <div class="dcontent">
        <div id="setup-block" hidden>
          <p class="sectitle">Créez votre restaurant pour commencer</p>
          <form class="form" id="setup-form" style="padding:0;max-width:420px;">
            <div class="field"><label for="name">Nom du commerce</label><input id="name" name="name" required></div>
            <div class="field">
              <label for="business_type">Type de commerce</label>
              <select id="business_type" name="business_type">
                <option value="food">Repas</option>
                <option value="fashion">Mode</option>
                <option value="furniture">Meubles</option>
                <option value="grocery">Supermarché</option>
              </select>
            </div>
            <div class="field"><label for="cuisine_origine">Cuisine</label><input id="cuisine_origine" name="cuisine_origine" placeholder="Sénégal, Cameroun…"></div>
            <div class="field"><label for="rccm">Numéro RCCM — facultatif</label><input id="rccm" name="rccm" maxlength="32"></div>
            <div class="field"><label for="adresse">Adresse</label><input id="adresse" name="adresse" required></div>
            <button type="button" class="btn btn-ghost" id="locate-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
              Utiliser ma position actuelle
            </button>
            <p class="state-msg" id="locate-status" style="margin:-6px 0 0;"></p>
            <div class="field"><label for="lat">Latitude</label><input id="lat" name="lat" type="number" step="any" required value="5.3600"></div>
            <div class="field"><label for="lng">Longitude</label><input id="lng" name="lng" type="number" step="any" required value="-4.0083"></div>
            <button type="submit" class="btn btn-primary">Créer mon commerce</button>
            <p class="error-msg" id="setup-error" hidden></p>
          </form>
        </div>

        <div class="board" id="board" hidden></div>
      </div>
    </main>
  </div>

  <script src="https://js.pusher.com/8.4/pusher.min.js"></script>
  <script type="module" src="./js/pages/backoffice.js"></script>
</body>
</html>
