<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo — livraison de cuisine africaine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script type="module" src="/js/register-sw.js"></script></head>
<body>
  <header class="header">
    <img src="/assets/logo.png" alt="Ayo" class="brand-logo">
    <div class="idrow">
      <a class="avatar" id="avatar" href="/login.html" style="text-decoration:none;">?</a>
      <div class="idcol">
        <span class="hello" id="hello">Bonjour</span>
        <button class="locrow" id="location" type="button">Choisir une adresse</button>
      </div>
      <a class="notif-btn" id="notif-btn" href="/orders.html" aria-label="Suivi de commande">
        <span class="notif-dot" id="notif-dot" hidden></span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </a>
    </div>
  </header>

  <main class="content with-nav">
    <div id="active-order-slot"></div>
    <div id="recommendation-slot"></div>
    <h1 class="title">Qu'est-ce qui te fait envie&nbsp;?</h1>

    <div class="cat-row" id="business-type-tabs">
      <button class="cat-tile active" data-type="food" type="button">
        <span class="cat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v7a2 2 0 002 2v11"/><path d="M6 2v7"/><path d="M10 2v7"/><path d="M18 2c-2 0-3 2-3 6s1 4 3 4v10"/></svg></span>
        Repas
      </button>
      <button class="cat-tile" data-type="fashion" type="button">
        <span class="cat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4L4 7l2 3 2-1.5V21h8V8.5L18 10l2-3-4-3-2 2h-4z"/></svg></span>
        Mode
      </button>
      <button class="cat-tile" data-type="furniture" type="button">
        <span class="cat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V8a2 2 0 012-2h10a2 2 0 012 2v3"/><path d="M4 11h16a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3a1 1 0 011-1z"/><path d="M5 16v3M19 16v3"/></svg></span>
        Meubles
      </button>
      <button class="cat-tile" data-type="grocery" type="button">
        <span class="cat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-13z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg></span>
        Supermarché
      </button>
    </div>

    <div class="search">
      <input id="search-input" type="search" placeholder="Plat, restaurant, région d'Afrique…" autocomplete="off">
    </div>

    <div class="chiprow" id="region-chips">
      <button class="chip active" data-region="">Tout</button>
      <button class="chip" data-region="Sénégal">Sénégal</button>
      <button class="chip" data-region="Côte d'Ivoire">Côte d'Ivoire</button>
      <button class="chip" data-region="Cameroun">Cameroun</button>
      <button class="chip" data-region="Nigeria">Nigeria</button>
      <button class="chip" data-region="Éthiopie">Éthiopie</button>
    </div>

    <section>
      <h2 class="sechead" id="list-heading">Restaurants près de toi</h2>
      <div id="restaurant-list" class="rlist" aria-live="polite">
        <p class="state-msg">Chargement des restaurants…</p>
      </div>
    </section>
  </main>

  <nav class="bottomnav">
    <a href="/index.html" class="active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Accueil
    </a>
    <a href="/orders.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-1.5 9h-13z"/><path d="M6.5 13L5 4"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      Commandes
    </a>
    <a href="/account.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      Compte
    </a>
  </nav>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
