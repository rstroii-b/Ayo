<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace livreur — Ayo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14181B">
<link rel="icon" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script type="module" src="/js/register-sw.js"></script></head>
<body>
  <header class="header">
    <img src="/assets/logo.png" alt="Ayo" class="brand-logo">
    <div class="idrow">
      <button class="avatar" id="avatar" type="button" style="border:none;cursor:pointer;" aria-label="Se déconnecter">?</button>
      <div class="idcol">
        <span class="hello">Bonjour</span>
        <span class="locrow">Espace livreur</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <span id="online-label" class="state-msg" style="margin:0;">Hors ligne</span>
        <button class="sw off" id="online-switch" type="button" aria-label="Basculer en ligne"></button>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="stripe-banner"></div>
    <h1 class="title" id="page-title">Commandes disponibles</h1>
    <div id="driver-content"><p class="state-msg">Chargement…</p></div>
  </main>

  <script type="module" src="./js/pages/driver.js"></script>
</body>
</html>
